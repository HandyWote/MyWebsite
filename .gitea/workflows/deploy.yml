name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-local
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # The deploy host only pulls and runs; local edits are never
            # intentional, so force the checkout to discard dirty state.
            # (core.filemode=false is set locally on the host so NAS ACL
            # mode rewrites are not seen as changes.)
            git fetch --prune origin
            git reset --hard origin/main
            # Images are built on GitHub Actions and pushed to the Gitea
            # registry; the server only pulls. Requires a one-time
            # `docker login git.unself.cn` on the deploy host.
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps
