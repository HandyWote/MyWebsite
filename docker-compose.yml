services:
  # Local development database.
  # Production should remove this service and use an external database.
  # postgres:
  #   image: docker.1ms.run/postgres:16-alpine
  #   container_name: mywebsite-postgres
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-mywebsite}
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
  #     TZ: ${TZ:-Asia/Shanghai}
  #   ports:
  #     - 5432:5432
  #   volumes:
  #     - ./data/postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - Web_network
  #   restart: always
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d mywebsite"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s

  backend:
    # Registry image used by deploy-time `docker compose pull`;
    # `build:` is kept for local development.
    image: git.unself.cn/handy_wote/mywebsite-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-5000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-mywebsite}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-52428800}
      ALLOWED_IMAGE_EXTENSIONS: ${ALLOWED_IMAGE_EXTENSIONS:-jpg,jpeg,png,webp}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-}
      NEXT_REVALIDATION_URL: >-
        ${NEXT_REVALIDATION_URL:-http://next-web:3000/internal/revalidate}
      REVALIDATION_TOKEN: ${REVALIDATION_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4419}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      JWT_REMEMBER_TOKEN_EXPIRES: ${JWT_REMEMBER_TOKEN_EXPIRES:-604800}
      COMMENT_LIMIT_ENABLED: ${COMMENT_LIMIT_ENABLED:-true}
      COMMENT_LIMIT_TIME_WINDOW: ${COMMENT_LIMIT_TIME_WINDOW:-24}
      COMMENT_LIMIT_MAX_COUNT: ${COMMENT_LIMIT_MAX_COUNT:-1}
      COMMENT_LIMIT_EXEMPT_ADMIN: ${COMMENT_LIMIT_EXEMPT_ADMIN:-true}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - Web_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  next-web:
    # Registry image used by deploy-time `docker compose pull`;
    # `build:` is kept for local development.
    image: git.unself.cn/handy_wote/mywebsite-next
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:5000}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4419}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:5000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4419}
      REVALIDATION_TOKEN: ${REVALIDATION_TOKEN:-}
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - next_cache:/app/.next/cache
    networks:
      - Web_network
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/')
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  edge-nginx:
    image: docker.1ms.run/nginx:alpine
    ports:
      - "4419:80"
    volumes:
      - ./nginx.edge.conf:/etc/nginx/nginx.conf:ro
    networks:
      - Web_network
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      next-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/edge-health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  Web_network:
    driver: bridge

volumes:
  backend_uploads:
  next_cache:
